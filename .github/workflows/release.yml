name: release

# Single-step release pipeline using monorel v1's `monorel auto`.
# Fires on every push to main. The action's `monorel auto` step
# detects whether HEAD is a release-PR merge:
#
#   - On a regular feature merge: applies pending `.changeset/*.md`
#     files onto a staging branch, force-pushes, and upserts the
#     always-open release PR. The PR's body shows the rendered
#     plan; its diff IS the file changes the next release will
#     produce.
#   - On the merge of that release PR (subject `chore(release): ...`):
#     creates per-package tags from HEAD's `monorel-Release:`
#     trailers, pushes them with `--follow-tags`, and creates one
#     GitHub Release per tag with the body sourced from each tag's
#     CHANGELOG entry.
#
# `deploy-docs` runs as a workflow_call after the action completes,
# but only on the `chore(release):` commit so we don't redeploy the
# docs site on every feature merge. Releases created via
# secrets.GITHUB_TOKEN do not propagate `release: published` events
# (GitHub anti-recursion), so docs.yml's release trigger never fires
# from a monorel-driven release; we call docs.yml directly here.
#
# Replaces the v0.x split of release-pr.yml + release.yml. Single
# workflow, single step, no `command` input.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  monorel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # monorel runs `go mod tidy` with GOTOOLCHAIN=local during the
      # release path, so Go must already be installed at a version
      # satisfying every released sub-module's `go` directive (every
      # sub-module here is `go 1.25.0`).
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: '**/go.sum'

      - uses: disaresta-org/monorel/ci/github@v1.0.2

  deploy-docs:
    # Only deploy docs on the release-PR merge commit, not on every
    # feature merge. `monorel auto` does PR-upsert work on those
    # pushes; nothing in the docs site changes from upserting a PR.
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'chore(release):') }}
    needs: monorel
    uses: ./.github/workflows/docs.yml
    permissions:
      contents: read
      pages: write
      id-token: write
